##############################################################################
# 05-templates.cfg — шаблони (register 0, не є реальними об'єктами)
##############################################################################

# --- Хости ------------------------------------------------------------------
define host {
    name                            generic-host
    notifications_enabled           1
    event_handler_enabled           1
    flap_detection_enabled          1
    process_perf_data               1
    retain_status_information       1
    retain_nonstatus_information    1

    check_period                    24x7
    notification_period             24x7
    notification_options            d,u,r

    max_check_attempts              3
    check_interval                  2
    retry_interval                  1
    notification_interval           60

    contact_groups                  noc
    register                        0
}

define host {
    name                            switch-host
    use                             generic-host
    check_command                   check_ping!200.0,20%!500.0,60%
    register                        0
}

define host {
    name                            camera-host
    use                             generic-host
    check_command                   check_ping!200.0,20%!500.0,60%
    # камери зникають частіше за комутатори -> трохи швидша реакція
    check_interval                  1
    register                        0
}

define host {
    name                            nvr-host
    use                             generic-host
    check_command                   check_ping!200.0,20%!500.0,60%
    register                        0
}

# --- Сервіси ----------------------------------------------------------------
define service {
    name                            generic-service
    active_checks_enabled           1
    passive_checks_enabled          1
    parallelize_check               1
    obsess_over_service             1
    check_freshness                 0

    notifications_enabled           1
    event_handler_enabled           1
    flap_detection_enabled          1
    process_perf_data               1
    retain_status_information       1
    retain_nonstatus_information    1

    check_period                    24x7
    notification_period             24x7
    notification_options            c,w,u,r

    max_check_attempts              3
    check_interval                  3
    retry_interval                  1
    notification_interval           60
    first_notification_delay        0

    contact_groups                  noc
    register                        0
}

define service {
    name                            camera-service
    use                             generic-service
    check_interval                  1
    register                        0
}
