##############################################################################
# 00-commands.cfg — команди перевірок і нотифікацій
# $USER1$ = /opt/nagios/libexec   (plugins)
# $USER5$ = SNMP community        (resource.cfg, генерується deploy.sh)
##############################################################################

# --- Мережеві перевірки -----------------------------------------------------
define command {
    command_name    check_ping
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w $ARG1$ -c $ARG2$ -p 5 -t 30
}

define command {
    command_name    check_tcp
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$ -w 2 -c 5 -t 10
}

define command {
    command_name    check_http
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -w 5 -c 10 -t 15
}

# --- SNMPv2c ----------------------------------------------------------------
# sysUpTime (1.3.6.1.2.1.1.3.0) віддається в ТІКАХ: 1 тік = 1/100 секунди.
# check_snmp бере число з дужок ("Timeticks: (359839) 0:59:58.39" -> 359839)
# і порівнює з порогами саме його — тому пороги теж у тіках:
#   30000 = 300 c (5 хв) -> WARNING
# Сенс: пристрій щойно перезавантажився. Пороги "300:"/"60:" (у секундах)
# означали б 3 c та 0.6 c, тобто не спрацювали б ніколи — перевірено на
# реальному рестарті sim-camera: uptime 12.76 c давав OK.
#
# CRITICAL навмисно вимкнено: "-c 0:" = діапазон [0, +inf), тобто значення
# ніколи не виходить за межі. Перезавантаження — це WARNING, а CRITICAL
# лишаємо для реальної аварії (PING/SNMP timeout), щоб рестарт пристрою
# не виглядав як "пристрій лежить".
define command {
    command_name    check_snmp_uptime
    command_line    $USER1$/check_snmp -H $HOSTADDRESS$ -P 2c -C $USER5$ -o 1.3.6.1.2.1.1.3.0 -l Uptime -u "" -w 30000: -c 0: -t 10
}

# ifNumber: 0 інтерфейсів = SNMP-агент віддав сміття
define command {
    command_name    check_snmp_ifnumber
    command_line    $USER1$/check_snmp -H $HOSTADDRESS$ -P 2c -C $USER5$ -o 1.3.6.1.2.1.2.1.0 -l IfNumber -w 1: -c 1: -t 10
}

