# --- Нотифікації в Telegram -------------------------------------------------
# Виклик через `bash` навмисно: файл монтується з хоста, і якщо в клоні
# відсутній exec-біт (типово для Windows-клонів), прямий запуск дає
# "Permission denied". `bash script` працює завжди.
define command {
    command_name    notify-host-by-telegram
    command_line    bash /opt/nagios-config/tools/notify_telegram.sh host \
                    "$NOTIFICATIONTYPE$" "$HOSTNAME$" "$HOSTSTATE$" \
                    "$HOSTOUTPUT$" "$SHORTDATETIME$"
}

define command {
    command_name    notify-service-by-telegram
    command_line    bash /opt/nagios-config/tools/notify_telegram.sh service \
                    "$NOTIFICATIONTYPE$" "$HOSTNAME$" "$SERVICEDESC$" "$SERVICESTATE$" \
                    "$SERVICEOUTPUT$" "$SHORTDATETIME$"
}
