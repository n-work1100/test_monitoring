##############################################################################
# 00-commands.cfg — команди перевірок і нотифікацій
# $USER1$ = /opt/nagios/libexec   (plugins)
# $USER5$ = SNMP community        (resource.cfg, генерується deploy.sh)
##############################################################################

# --- Мережеві перевірки -----------------------------------------------------
define command {
    command_name    check_ping
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w $ARG1$ -c $ARG2$ -p 5 -t 30
}

define command {
    command_name    check_tcp
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$ -w 2 -c 5 -t 10
}

define command {
    command_name    check_http
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -w 5 -c 10 -t 15
}

# --- SNMPv2c ----------------------------------------------------------------
# sysUpTime: warning, якщо uptime < 300 c; critical, якщо < 60 c
# (тобто пристрій щойно перезавантажився)
define command {
    command_name    check_snmp_uptime
    command_line    $USER1$/check_snmp -H $HOSTADDRESS$ -P 2c -C $USER5$ -o 1.3.6.1.2.1.1.3.0 -l Uptime -u "" -w 300: -c 60: -t 10
}

# ifNumber: 0 інтерфейсів = SNMP-агент віддав сміття
define command {
    command_name    check_snmp_ifnumber
    command_line    $USER1$/check_snmp -H $HOSTADDRESS$ -P 2c -C $USER5$ -o 1.3.6.1.2.1.2.1.0 -l IfNumber -w 1: -c 1: -t 10
}

