##############################################################################
# 01-timeperiods.cfg — базові періоди часу.
#
# 24x7 використовується шаблонами хостів/сервісів (05-templates.cfg),
# контактом NOC (10-contacts.cfg) і generated/dependencies.cfg.
# Без цього визначення nagios -v падає:
#   Error: Service notification period '24x7' ... is not defined anywhere!
#
# Файл мусить бути підключений у nagios.cfg (cfg_file=.../01-timeperiods.cfg).
##############################################################################

define timeperiod {
    timeperiod_name 24x7
    alias           24 Hours A Day, 7 Days A Week
    sunday          00:00-24:00
    monday          00:00-24:00
    tuesday         00:00-24:00
    wednesday       00:00-24:00
    thursday        00:00-24:00
    friday          00:00-24:00
    saturday        00:00-24:00
}
