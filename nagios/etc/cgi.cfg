##############################################################################
# cgi.cfg — конфигурация CGI (веб-интерфейс Nagios)
#
# ПОЧЕМУ ЭТОТ ФАЙЛ ЛЕЖИТ В РЕПОЗИТОРИИ:
#   образ jasonrivers/nagios копирует свои дефолтные файлы в /opt/nagios/etc
#   ТОЛЬКО если каталог пуст. Мы монтируем туда свой каталог (config-as-code),
#   поэтому cgi.cfg из образа не появится — без него все CGI отдают
#   "Error: Could not open CGI config file".
#   htpasswd.users, наоборот, создаёт start_nagios при старте (см. .gitignore).
#
# Учётка UI по умолчанию (из образа): nagiosadmin / nagios
##############################################################################

# --- Основные пути -----------------------------------------------------------
main_config_file=/opt/nagios/etc/nagios.cfg
physical_html_path=/opt/nagios/share
url_html_path=/nagios

# --- Поведение интерфейса ----------------------------------------------------
show_context_help=0
use_pending_states=1
refresh_rate=90
result_limit=100
escape_html_tags=1

action_url_target=_self
notes_url_target=_self
lock_author_names=1

# --- Аутентификация/авторизация ---------------------------------------------
# Basic-auth проверяет Apache (htpasswd.users), а эти директивы говорят CGI,
# что именно разрешено пользователю nagiosadmin.
use_authentication=1
use_ssl_authentication=0

authorized_for_system_information=nagiosadmin
authorized_for_configuration_information=nagiosadmin
authorized_for_system_commands=nagiosadmin

authorized_for_all_services=nagiosadmin
authorized_for_all_hosts=nagiosadmin
authorized_for_all_service_commands=nagiosadmin
authorized_for_all_host_commands=nagiosadmin

# --- Раскладки карт статусов -------------------------------------------------
default_statusmap_layout=5
default_statuswrl_layout=4

# --- Пинг из WAP-интерфейса --------------------------------------------------
ping_syntax=/bin/ping -n -U -c 5 $HOSTADDRESS$
