##############################################################################
# Nagios Core + симулятори SNMP-пристроїв (навчальна лабораторія)
#
#   bash tools/deploy.sh     pull -> gen -> nagios -v -> up -d -> restart (ADR-009)
#   UI: http://localhost:${NAGIOS_PORT:-8080}/nagios/   (nagiosadmin / nagios)
#   Перезбірка образів — окремо: make build (не на кожному деплої)
##############################################################################

services:
  nagios:
    image: jasonrivers/nagios:latest
    container_name: nagios
    restart: unless-stopped
    ports:
      # Хост-порт задається NAGIOS_PORT у .env (дефолт 8080).
      # 8080 часто зайнятий (напр. WordPress) — тоді в .env ставимо 8090.
      - "${NAGIOS_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      # коректні таймстемпи в логах/нотифікаціях
      - TZ=Europe/Kyiv
    volumes:
      # конфігурація (nagios.cfg, conf.d, resource.cfg)
      - ./nagios/etc:/opt/nagios/etc
      # скрипти нотифікацій (notify_telegram.sh) — read-only
      - ./tools:/opt/nagios-config/tools:ro
      # стан і логи Nagios (nagios.log, retention.dat, perfdata).
      # Без іменованого тому це анонімний volume: `up --force-recreate`
      # (напр. після зміни .env) створює новий — історія/статуси зникають.
      - nagios-var:/opt/nagios/var
    networks:
      - labnet
    depends_on:
      - sim-switch
      - sim-camera

  # --- симулятор комутатора: net-snmp, sysUpTime/sysDescr/ifNumber ----------
  sim-switch:
    build:
      context: ./sim/snmpd
    container_name: sim-switch
    restart: unless-stopped
    networks:
      labnet:
        ipv4_address: 172.30.0.11

  # --- симулятор IP-камери: snmpd + фейкові TCP 554 (RTSP) і 80 (web) ------
  sim-camera:
    build:
      context: ./sim/camera
    container_name: sim-camera
    restart: unless-stopped
    networks:
      labnet:
        ipv4_address: 172.30.0.21

networks:
  labnet:
    driver: bridge
    ipam:
      config:
        # «VLAN моніторингу»: окремий сегмент для SNMP/ICMP між Nagios і пристроями
        - subnet: 172.30.0.0/24

volumes:
  # Історія/статуси Nagios: переживають `up --force-recreate` і `down`
  # (видаляється лише `docker compose down -v`).
  nagios-var:
