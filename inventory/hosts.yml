# ============================================================================
# SOURCE OF TRUTH (єдине джерело правди) для системи моніторингу.
#
# Правило: додаєте/змінюєте пристрій ТУТ, потім `python tools/gen.py`,
# коміт + Pull Request. Ніколи не правте nagios/etc/conf.d/generated вручну.
#
# Поля:
#   name       — унікальне ім'я хоста в Nagios (латиниця, дефіси)
#   alias      — людська назва
#   address    — IP або DNS-ім'я
#   role       — switch | camera | nvr  (визначає шаблон і набір сервісів)
#   site       — логічна локація (стає hostgroup site-<site>)
#   monitoring — false, щоб пристрій був у SoT, але не моніторився (default: true)
#   notes      — довільний коментар (потрапляє в конфіг Nagios)
# ============================================================================

defaults:
  site: lab
  monitoring: true

hosts:
  # --- симулятори з docker-compose.yml -------------------------------------
  - name: sw-lab-01
    alias: "Lab access switch (simulated)"
    address: 172.30.0.11
    role: switch
    site: lab
    notes: "net-snmp у Docker, VLAN моніторингу 172.30.0.0/24"

  - name: cam-lab-01
    alias: "Lab IP camera (simulated)"
    address: 172.30.0.21
    role: camera
    site: lab
    notes: "snmpd + фейкові TCP 554/80"

  # --- приклад: пристрій заведено в SoT, але моніторинг вимкнено -----------
  - name: nvr-lab-01
    alias: "Lab NVR (ще не підключений)"
    address: 172.30.0.31
    role: nvr
    site: lab
    monitoring: false
    notes: "заглушка для демонстрації прапорця monitoring: false"
